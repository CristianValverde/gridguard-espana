[pytest]
# Solo recogemos tests reales; scripts/ contiene smoke-tests manuales de CLI
# (p.ej. scripts/test_aemet.py, con funciones test_*(api_key) que no son pytest).
testpaths = eval tests
# Por defecto la suite corre en frío/offline: los tests `integration` requieren
# claves de API vivas y/o artefactos ML entrenados. Ejecutarlos con:
#   pytest -m integration
addopts = -m "not integration"
markers =
    integration: end-to-end tests that require live API keys and trained ML models
    agent_orchestrator: evals del Orchestrator
    agent_anomaly: evals del AnomalyDetector
    agent_renewables: evals del RenewablesForecast
    agent_regulatory: evals del RegulatoryCompliance
    agent_report: evals del ReportAgent
    agent_cross_border: evals del CrossBorder
